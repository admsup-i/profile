name: Secure CI/CD Pipeline

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/profile

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v2

  iac-and-source-scan:
    name: IaC, dependency and filesystem scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan code, Dockerfile and Kubernetes YAML
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Block vulnerable new dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

  build-scan-sign:
    name: Build, scan, sign and push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
      - secret-scan
      - iac-and-source-scan
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write
      attestations: write

    outputs:
      image_ref: ${{ steps.image-digest.outputs.image_ref }}
      digest: ${{ steps.image-digest.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fail fast if DockerHub secrets are missing
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]]; then
            echo "::error::DOCKERHUB_USERNAME secret is empty or not set for the 'production' environment."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Single build + push. We do NOT build a second time later — every
      # earlier version of this workflow that built the image twice (once
      # locally to scan, once again to push) risked the second build
      # producing a different/empty digest. One build, one digest, used
      # everywhere downstream.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Resolve and validate immutable image digest
        id: image-digest
        run: |
          set -euo pipefail

          DIGEST="${{ steps.build.outputs.digest }}"
          echo "Raw digest output from build step: '${DIGEST}'"

          if [[ -z "${DIGEST}" || "${DIGEST}" != sha256:* ]]; then
            echo "::error::build-push-action returned an empty or malformed digest ('${DIGEST}'). Check the 'Build and push image' step log above for push failures."
            exit 1
          fi

          IMAGE_REF="${IMAGE_NAME}@${DIGEST}"

          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

          echo "Resolved image_ref=${IMAGE_REF}"

      # Scan the actual pushed artifact (by digest) rather than a local
      # tag, so what's scanned is guaranteed to be what gets signed.
      - name: Scan pushed Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image-digest.outputs.image_ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image using GitHub identity
        run: |
          set -euo pipefail
          cosign sign --yes "${{ steps.image-digest.outputs.image_ref }}"

      - name: Verify image signature
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity \
              "https://github.com/${{ github.repository }}/.github/workflows/main.yml@refs/heads/main" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            "${{ steps.image-digest.outputs.image_ref }}"

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image-digest.outputs.image_ref }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Attach signed SBOM to the image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image-digest.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Confirm outputs being handed to deploy job
        run: |
          echo "job output image_ref -> ${{ steps.image-digest.outputs.image_ref }}"
          echo "job output digest    -> ${{ steps.image-digest.outputs.digest }}"

  deploy:
    name: Verify and deploy to Kubernetes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-scan-sign
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Confirm image ref was received from previous job
        run: |
          set -euo pipefail
          IMAGE_REF="${{ needs.build-scan-sign.outputs.image_ref }}"
          if [[ -z "${IMAGE_REF}" || "${IMAGE_REF}" != *"@sha256:"* ]]; then
            echo "::error::image_ref output from build-scan-sign job is missing or malformed: '${IMAGE_REF}'"
            exit 1
          fi
          echo "Deploying image_ref=${IMAGE_REF}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify signature immediately before deployment
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity \
              "https://github.com/${{ github.repository }}/.github/workflows/main.yml@refs/heads/main" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            "${{ needs.build-scan-sign.outputs.image_ref }}"

      - name: Copy Kubernetes manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/*"
          target: "/home/${{ secrets.EC2_USERNAME }}/profile"

      - name: Deploy immutable signed image
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            DIR="/home/${{ secrets.EC2_USERNAME }}/profile/k8s"
            IMAGE_REF="${{ needs.build-scan-sign.outputs.image_ref }}"

            sed -i "s|__IMAGE__|${IMAGE_REF}|g" "${DIR}/deployment.yaml"

            kubectl apply -f "${DIR}/deployment.yaml"
            kubectl apply -f "${DIR}/service.yaml"

            kubectl annotate deployment/profile \
              -n production \
              kubernetes.io/change-cause="GitHub Actions run #${{ github.run_number }} | commit ${{ github.sha }}" \
              --overwrite

            kubectl rollout status deployment/profile \
              -n production \
              --timeout=120s

